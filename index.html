<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Somewhere in India — A Little Night Story</title>
  <meta name="theme-color" content="#090b0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="photo"></div>
    <div class="cinema"></div>
    <div class="grain"></div>

    <header class="topbar">
      <span id="clock">11:47 PM</span>
      <div class="location"><i></i> SOMEWHERE, INDIA</div>
      <button class="help" id="help">?</button>
    </header>

    <section class="hero">
      <div class="eyebrow">A LITTLE NIGHT STORY</div>
      <h1>Somewhere<br><span>in India.</span></h1>
      <p>Not a place. Just a moment.</p>
    </section>

    <!-- A lightweight animated metro foreground: intentionally a real-looking train silhouette with illuminated windows -->
    <div class="metro-wrap" aria-hidden="true">
      <div class="metro">
        <div class="metro-head"></div>
        <div class="windows">
          <b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b>
        </div>
        <div class="metro-lights"></div>
      </div>
    </div>

    <button class="chai-card" id="chai">
      <span class="steam">♨</span>
      <span><small>ROAD SIDE</small>चाय</span>
    </button>

    <section class="radio" aria-label="Somewhere Radio">
      <div class="radio-top">
        <span>SOMEWHERE RADIO</span>
        <span>90s / LATE NIGHT</span>
      </div>
      <div class="radio-main">
        <div class="album">♪</div>
        <div class="track">
          <small id="state">READY</small>
          <strong id="title">Late Night FM</strong>
          <div class="progress"><i id="bar"></i></div>
          <small><span id="current">00:00</span> / <span id="duration">00:00</span></small>
        </div>
        <button id="prev" class="skip">‹</button>
        <button id="play" class="play">▶</button>
        <button id="next" class="skip">›</button>
      </div>
      <div class="radio-bottom">
        <span id="count">01 / 05</span>
        <span id="source">Music source will be added later</span>
      </div>
    </section>

    <footer>
      <span id="footerClock">11:47 PM · SOMEWHERE IN INDIA</span>
      <span id="sound">SOUND OFF</span>
    </footer>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
