<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Somewhere, India</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#090d10;color:#f7f0df}
body{font-family:Arial,sans-serif;overflow:hidden}
.hero{
  position:relative;width:100%;height:100vh;overflow:hidden;
  background:
    linear-gradient(rgba(5,8,12,.10),rgba(5,8,12,.25)),
    url("india-night.jpg") center/cover no-repeat;
}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.12) 60%,rgba(0,0,0,.20));
}
.top{position:absolute;z-index:8;top:22px;left:5%;right:5%;height:48px;display:flex;align-items:center}
.pill{
  position:absolute;left:50%;transform:translateX(-50%);
  padding:13px 22px;border-radius:28px;border:1px solid rgba(255,255,255,.22);
  background:rgba(7,15,20,.45);backdrop-filter:blur(10px);
  font:14px "Courier New",monospace;letter-spacing:2px;white-space:nowrap
}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22d77a;margin-right:9px}
.credit{margin-left:auto;font-size:14px;color:#f7f0df}
.credit b{font:italic 700 18px Georgia,serif}
.side{
  position:absolute;z-index:8;right:3.5%;top:16%;width:58px;height:58px;
  border:0;border-radius:50%;background:rgba(35,29,38,.55);color:#fff;font-size:18px;
  cursor:pointer
}
.side.music{top:25%}
.content{position:absolute;z-index:3;left:6%;top:46%;max-width:650px}
.overline{font:13px "Courier New",monospace;letter-spacing:4px;color:#f1d7c8}
h1{font-size:clamp(58px,7vw,104px);line-height:.88;margin:22px 0 28px;font-weight:800;letter-spacing:-4px}
.subtitle{font:17px "Courier New",monospace;letter-spacing:1px}
.story{position:absolute;z-index:3;left:6%;bottom:13%;width:54%;max-width:800px}
.tricolor{height:4px;width:100%;display:flex;border-radius:10px;overflow:hidden;margin-bottom:22px}
.tricolor .saf{width:33.33%;background:#f39a38}.tricolor .whi{width:33.33%;background:#f7f0df}.tricolor .grn{width:33.33%;background:#28c987}
.tag{font:14px "Courier New",monospace;letter-spacing:3px}.story h2{font-size:22px;margin:14px 0 0}

.player{
  position:absolute;z-index:20;right:3%;bottom:0;
  width:min(58vw,890px);min-height:205px;
  overflow:hidden;border-radius:28px 28px 0 0;
  background:radial-gradient(circle at 18% 70%,rgba(160,60,25,.25),transparent 34%),
             radial-gradient(circle at 82% 30%,rgba(30,100,85,.20),transparent 40%),
             rgba(8,12,16,.92);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 -8px 40px rgba(0,0,0,.22);
  pointer-events:auto;
}
.player .ph{
  display:flex;justify-content:space-between;align-items:center;
  color:rgba(247,240,223,.48);font:10px "Courier New",monospace;letter-spacing:3px;
  padding:12px 18px 0
}
.player-main{
  display:flex;align-items:center;gap:16px;padding:12px 18px 16px;
}
.album-art{
  width:64px;height:64px;flex:0 0 64px;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;background:linear-gradient(145deg,#f7f0df,#8c6b4d);
  border:2px solid rgba(255,255,255,.16);box-shadow:0 0 0 7px rgba(247,240,223,.05)
}
.album-art span{font-size:31px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.song{flex:1;min-width:0}
.song strong{display:block;color:#f7f0df;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:rgba(247,240,223,.58);font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;align-items:center;gap:8px;color:rgba(247,240,223,.55);font:10px "Courier New",monospace;margin-top:10px}
.seek input{width:100%;margin:0;accent-color:#f39a45;cursor:pointer}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex:0 0 auto}
.ctrl{
  width:32px;height:32px;padding:0;border:0;background:transparent;color:rgba(247,240,223,.75);
  border-radius:50%;font-size:17px;cursor:pointer;touch-action:manipulation
}
.ctrl:hover,.ctrl:active{color:#fff;background:rgba(255,255,255,.08)}
.play{
  width:54px;height:54px;flex:0 0 54px;border:0;border-radius:50%;
  background:#f7f0df;color:#10151a;font-size:18px;cursor:pointer;touch-action:manipulation
}
.pf{display:none}
button,input{font:inherit}
button{pointer-events:auto}
audio{display:none}

@media(max-width:800px) and (orientation:portrait){
  .top{top:14px}
  .pill{font-size:11px;padding:11px 16px}
  .credit{font-size:11px}.credit b{font-size:15px}
  .side{right:4%;top:16%;width:52px;height:52px}.side.music{top:25%}
  .content{left:6%;top:45%;max-width:88%}
  h1{font-size:clamp(48px,13vw,72px);letter-spacing:-2px;margin:18px 0 22px}
  .overline{font-size:10px}.subtitle{font-size:14px}
  .story{left:6%;bottom:13%;width:88%}
  .player{left:6%;right:6%;width:auto;min-height:142px;border-radius:24px 24px 0 0}
  .player .ph{padding:9px 15px 0;font-size:8px}
  .player-main{display:grid;grid-template-columns:52px minmax(0,1fr);gap:11px;padding:9px 15px 5px}
  .album-art{width:52px;height:52px;flex-basis:52px}
  .album-art span{font-size:25px}
  .song strong{font-size:15px}.artist{font-size:11px;margin-top:4px}
  .seek{font-size:8px;gap:5px;margin-top:6px}
  .controls{grid-column:1/-1;width:100%;gap:18px;padding:3px 0 0}
  .ctrl{width:30px;height:30px;font-size:16px}.play{width:50px;height:50px;flex-basis:50px}
}
@media(max-width:800px) and (orientation:landscape) and (max-height:500px){
  .top{top:10px;height:38px}
  .pill{font-size:9px;padding:9px 14px}
  .credit{font-size:9px}.credit b{font-size:13px}
  .side{width:42px;height:42px;right:3%;top:18%;font-size:15px}.side.music{top:39%}
  .content{left:7%;top:30%;max-width:52%}
  .overline{font-size:8px;letter-spacing:3px}
  h1{font-size:clamp(42px,8vw,62px);letter-spacing:-2px;margin:12px 0 14px}
  .subtitle{font-size:10px}
  .story{left:7%;bottom:9%;width:43%}
  .story .tricolor{margin-bottom:10px}.tag{font-size:9px}.story h2{font-size:14px;margin-top:7px}
  .player{right:3%;left:auto;width:64%;min-height:0;border-radius:22px 22px 0 0}
  .player .ph{padding:7px 11px 0;font-size:7px}
  .player-main{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;padding:7px 11px 10px}
  .album-art{width:42px;height:42px;flex-basis:42px}.album-art span{font-size:20px}
  .song strong{font-size:12px}.artist{font-size:8px;margin-top:3px}
  .seek{font-size:7px;gap:4px;margin-top:4px}
  .controls{grid-column:3;grid-row:1;width:auto;gap:5px}
  .ctrl{width:24px;height:24px;font-size:12px}.play{width:42px;height:42px;flex-basis:42px;font-size:15px}
}
</style>
</head>
<body>
<main class="hero">
<header class="top">
  <div class="pill"><span class="dot"></span>SOMEWHERE, INDIA</div>
  <div class="credit">created by <b>Utkarsh Jha</b></div>
</header>

<button class="side" type="button" aria-label="Info">?</button>
<button class="side music" type="button" aria-label="Music">♪</button>

<section class="content">
  <div class="overline">A LITTLE NIGHT STORY</div>
  <h1>Somewhere<br>in India.</h1>
  <p class="subtitle">Not a place. Just a moment.</p>
</section>

<section class="story">
  <div class="tricolor"><span class="saf"></span><span class="whi"></span><span class="grn"></span></div>
  <div class="tag">INDIA / NIGHT</div>
  <h2>Rain after dark</h2>
</section>

<section class="player" aria-label="Somewhere Radio">
  <div class="ph"><span>SOMEWHERE RADIO</span><span id="trackCount">01 / 03</span></div>
  <div class="player-main">
    <div class="album-art" aria-hidden="true"><span>☕</span></div>
    <div class="song">
      <strong id="trackTitle">Dheere - Dheere - Dheere</strong>
      <div class="artist" id="trackArtist">Abhijeet - Topic</div>
      <div class="seek">
        <span id="currentTime">0:00</span>
        <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="controls">
      <button type="button" class="ctrl" id="shuffle" aria-label="Shuffle">⌁</button>
      <button type="button" class="ctrl" id="prev" aria-label="Previous">|◀</button>
      <button type="button" class="play" id="play" aria-label="Play/Pause">▶</button>
      <button type="button" class="ctrl" id="next" aria-label="Next">▶|</button>
      <button type="button" class="ctrl" id="queue" aria-label="Playlist">☷</button>
    </div>
  </div>
  <audio id="audio" preload="metadata" playsinline></audio>
</section>
</main>

<script>
const playlist=[
  {file:"track1.mp3",title:"Dheere - Dheere - Dheere",artist:"Abhijeet - Topic"},
  {file:"track2.mp3",title:"Dil Hai Dil Hai",artist:"Unknown Artist"},
  {file:"track3.mp3",title:"Is Tarah Aashiqui Ka",artist:"Unknown Artist"}
];

const audio=document.getElementById("audio");
const playBtn=document.getElementById("play");
const prevBtn=document.getElementById("prev");
const nextBtn=document.getElementById("next");
const shuffleBtn=document.getElementById("shuffle");
const queueBtn=document.getElementById("queue");
const progress=document.getElementById("progress");
const currentTimeEl=document.getElementById("currentTime");
const durationEl=document.getElementById("duration");
const titleEl=document.getElementById("trackTitle");
const artistEl=document.getElementById("trackArtist");
const countEl=document.getElementById("trackCount");

let trackIndex=0;
let shuffle=false;

function fmt(sec){
  if(!Number.isFinite(sec)||sec<0) return "0:00";
  const s=Math.floor(sec), m=Math.floor(s/60), r=s%60;
  return m+":"+String(r).padStart(2,"0");
}

function loadTrack(i,autoplay=false){
  trackIndex=(i+playlist.length)%playlist.length;
  const t=playlist[trackIndex];
  audio.pause();
  audio.src=t.file;
  audio.load();
  titleEl.textContent=t.title;
  artistEl.textContent=t.artist;
  countEl.textContent=String(trackIndex+1).padStart(2,"0")+" / "+String(playlist.length).padStart(2,"0");
  currentTimeEl.textContent="0:00";
  durationEl.textContent="0:00";
  progress.value=0;
  playBtn.textContent="▶";
  if(autoplay) audio.play().then(()=>playBtn.textContent="Ⅱ").catch(()=>{});
}

async function togglePlay(){
  if(!audio.src) loadTrack(trackIndex,false);
  if(audio.paused){
    try{await audio.play();playBtn.textContent="Ⅱ";}
    catch(e){console.error(e);}
  }else{
    audio.pause();
  }
}

playBtn.addEventListener("click",e=>{e.preventDefault();togglePlay();});
prevBtn.addEventListener("click",e=>{e.preventDefault();loadTrack(trackIndex-1,true);});
nextBtn.addEventListener("click",e=>{
  e.preventDefault();
  const n=shuffle ? Math.floor(Math.random()*playlist.length) : trackIndex+1;
  loadTrack(n,true);
});
shuffleBtn.addEventListener("click",e=>{
  e.preventDefault();shuffle=!shuffle;shuffleBtn.classList.toggle("active",shuffle);
});
queueBtn.addEventListener("click",e=>{
  e.preventDefault();
  alert(playlist.map((t,i)=>(i===trackIndex?"▶ ":"   ")+t.title).join("\n"));
});
progress.addEventListener("input",()=>{
  if(Number.isFinite(audio.duration)&&audio.duration>0){
    audio.currentTime=(Number(progress.value)/1000)*audio.duration;
  }
});
audio.addEventListener("loadedmetadata",()=>{
  durationEl.textContent=fmt(audio.duration);
});
audio.addEventListener("timeupdate",()=>{
  currentTimeEl.textContent=fmt(audio.currentTime);
  if(Number.isFinite(audio.duration)&&audio.duration>0){
    progress.value=Math.round((audio.currentTime/audio.duration)*1000);
  }
});
audio.addEventListener("play",()=>playBtn.textContent="Ⅱ");
audio.addEventListener("pause",()=>playBtn.textContent="▶");
audio.addEventListener("ended",()=>{
  const n=shuffle ? Math.floor(Math.random()*playlist.length) : trackIndex+1;
  loadTrack(n,true);
});

loadTrack(0,false);
</script>
</body>
</html>
