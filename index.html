<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Somewhere, India</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="top">
    <div class="time" id="time">07:06 PM</div>
    <div class="place"><span></span>SOMEWHERE, INDIA</div>
    <div class="credit">created by <b>Utkarsh Jha</b></div>
  </header>

  <button class="float music" aria-label="Music">♪</button>

  <section class="intro">
    <div class="eyebrow">A LITTLE NIGHT STORY</div>
    <h1>Somewhere<br>in India.</h1>
    <p>Not a place. Just a moment.</p>
  </section>

  <section class="story">
    <div class="tricolor"><i></i><i></i><i></i></div>
    <div class="tag">INDIA / NIGHT</div>
    <h2>Rain after dark</h2>
  </section>

  <section class="player">
    <div class="p-head">
      <span>SOMEWHERE RADIO</span>
      <span>01 / 01</span>
    </div>
    <div class="p-main">
      <div class="disc">♪</div>
      <div class="song">
        <div class="ready"><b></b> READY</div>
        <strong>Late Night FM</strong>
        <div class="seek">
          <small>00:00</small>
          <input type="range" min="0" max="100" value="0">
          <small>00:00</small>
        </div>
      </div>
      <button class="play" id="play">▶</button>
    </div>
    <div class="p-foot">
      <span>90s / LATE NIGHT</span>
      <span>ADD YOUR AUDIO IN /audio</span>
    </div>
  </section>
</main>
<script>
const clock=document.getElementById('time');
function updateClock(){
  clock.textContent=new Date().toLocaleTimeString([],{
    hour:'2-digit',minute:'2-digit',hour12:true
  }).toUpperCase();
}
updateClock(); setInterval(updateClock,1000);
const play=document.getElementById('play');
let on=false;
play.onclick=()=>{on=!on;play.textContent=on?'Ⅱ':'▶'};
</script>
</body>
</html>
