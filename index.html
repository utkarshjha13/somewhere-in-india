<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Somewhere in India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="clock" id="clock">07:06 PM</div>
      <div class="location"><span class="dot"></span>SOMEWHERE, INDIA</div>
      <div class="credit">Created by <em>Utkarsh Jha</em></div>
    </header>

    <section class="hero">
      <div class="eyebrow">A LITTLE NIGHT STORY</div>
      <h1>Somewhere<br>in India.</h1>
      <p class="subtitle">Not a place. Just a moment.</p>

      <div class="story">
        <div class="tricolor-line"><i></i><b></b><em></em></div>
        <div class="section-tag">INDIA / NIGHT</div>
        <div class="story-title">Rain after dark</div>
      </div>
    </section>

    <section class="radio" aria-label="Somewhere Radio">
      <div class="radio-top">
        <span>SOMEWHERE RADIO</span>
        <span>90s / LATE NIGHT</span>
      </div>

      <div class="radio-main">
        <div class="art"><span>♪</span></div>

        <div class="track">
          <div class="status"><span class="dot"></span>READY</div>
          <div class="track-title">Late Night FM</div>
          <div class="progress-row">
            <span>00:00</span>
            <input id="progress" type="range" min="0" max="100" value="22">
            <span>00:00</span>
          </div>
        </div>

        <button class="play" id="play" aria-label="Play">▶</button>
      </div>

      <div class="radio-bottom">
        <span>90s / LATE NIGHT</span>
        <span>ADD YOUR AUDIO IN /audio</span>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
